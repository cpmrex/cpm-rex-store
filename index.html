<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPM REXX | Premium Car Store</title>

  <meta name="theme-color" content="#05050a">

  <link rel="stylesheet" href="style.css?v=14">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <div class="brand">

      <img
        src="cpm-rex-logo.png"
        alt="CPM REX Logo"
        class="logo"
      >

      <div class="brand-text">
        <h1>CPM REXX</h1>
        <p>PREMIUM CPM CAR STORE</p>
      </div>

    </div>

  </header>

  <!-- NAVIGATION -->
  <nav>
    <a href="#home">Home</a>
    <a href="#showroom">Showroom</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- HERO -->
  <section class="hero" id="home">
    <h2>WELCOME TO CPM REXX STORE</h2>
    <p>Discover Your Dream CPM Cars</p>
    <a href="#showroom" class="btn">EXPLORE SHOWROOM</a>
  </section>

  <!-- SHOWROOM -->
  <section id="showroom">

    <h2>CPM REXX SHOWROOM</h2>

    <div class="category-buttons">
      <button onclick="filterCars('Trending Cars')">🔥 Trending</button>
      <button onclick="filterCars('New Update Cars')">🆕 New Updates</button>
      <button onclick="filterCars('CPM2 Cars')">🚘 CPM2</button>
      <button onclick="filterCars('All')">All Cars</button>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
      <input
        type="text"
        id="carSearch"
        placeholder="🔍 Search your favourite car..."
        oninput="searchCars()"
      >
    </div>

    <!-- CART -->
    <div class="cart-section">
      <button onclick="showCart()">
        🛒 MY CART (<span id="cartCount">0</span>)
      </button>
    </div>

    <div id="cartBox" style="display:none;">
      <h2>MY SHOPPING CART</h2>
      <div id="cartItems"></div>
      <h3>Total: PKR <span id="cartTotal">0</span></h3>
      <button onclick="chooseOrderMethod()">I WANT TO ORDER</button>
    </div>

    <!-- CAR LIST -->
    <div id="carList"></div>

  </section>

  <!-- FOOTER -->
  <footer id="contact">
    <h3>CPM REXX</h3>
    <p>Premium CPM Cars • Quality • Style</p>
    <p>© 2026 Elite CPM Garage. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=13"></script>

</body>
</html>
